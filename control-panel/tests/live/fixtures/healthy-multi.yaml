apiVersion: v1
kind: app
integration: basic
version: 1.0.0
metadata:
  id: session-multi
  name: Session Multi
  description: Session-only two-container same-app network fixture.
  icon: boxes
  category: development
  defaultSubdomain: session-multi
database:
  mode: none
containers:
  - name: web
    type: oci
    primary: true
    image: docker.io/library/nginx:1.27.4-alpine
    port: 80
    healthCheck:
      type: http
      path: /
      timeout: 60000
      retries: 3
  - name: peer
    type: oci
    image: docker.io/library/nginx:1.27.4-alpine
    port: 80
    healthCheck:
      type: http
      path: /
      timeout: 60000
      retries: 3
internet:
  hosts: []
entrances:
  - name: web
    port: 80
    container: web
    authLevel: none
