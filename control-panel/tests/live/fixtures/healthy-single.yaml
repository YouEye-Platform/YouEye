apiVersion: v1
kind: app
integration: basic
version: 1.0.0
metadata:
  id: session-healthy
  name: Session Healthy
  description: Session-only healthy single-container network fixture.
  icon: server
  category: development
  defaultSubdomain: session-healthy
database:
  mode: none
containers:
  - name: web
    type: oci
    primary: true
    image: docker.io/library/nginx:1.27.4-alpine
    port: 80
    healthCheck:
      type: http
      path: /
      timeout: 60000
      retries: 3
internet:
  hosts: []
entrances:
  - name: web
    port: 80
    container: web
    authLevel: none
