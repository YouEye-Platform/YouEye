schema: youeye.setup.v1
for: connect:prowlarr
steps:
  - http:
      method: DELETE
      path: /api/v1/applications/${item.id}
      target: peer
      headers:
        X-Api-Key: ${peer.api_key}
      for_each:
        path: /api/v1/applications
        where: {name: Radarr}
  - http:
      method: POST
      path: /api/v1/applications
      target: peer
      headers:
        X-Api-Key: ${peer.api_key}
      body:
        name: Radarr
        implementation: Radarr
        configContract: RadarrSettings
        syncLevel: fullSync
        tags: []
        fields:
          - name: prowlarrUrl
            value: ${peer.url}
          - name: baseUrl
            value: ${self.url}
          - name: apiKey
            value: ${self.api_key}
          - name: syncCategories
            value: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060, 2070, 2080]
      allow_failure: true
