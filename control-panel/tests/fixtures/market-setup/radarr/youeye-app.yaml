schema: youeye.app.v1
id: radarr
version: 6.4.4.10685
name: Radarr
listing:
  tagline: Your movie library, automated
  description: Smart PVR for your movie collection
  long_description: |
    Radarr is a movie collection manager for Usenet and BitTorrent users. It watches your
    indexers (via Prowlarr) for the films on your wanted list, grabs them through your
    download client, then renames and organises them into your library — automatically.
    Quality profiles, custom formats, and release-upgrade handling are all built in.
  release_notes: |
    Radarr 6.4.4.10685 improves allowed-host checks and logging, corrects
    iOS modals and automatic theme changes, and adds movie-file quality filtering.
  category: media
  tags: [media, movies, pvr, automation, arr]
  icon: film
  icon_file: icon.svg
  screenshots:
    - path: screenshots/platform-admin-public-domain-movie-6.3.0.10514.png
      caption: Historical 6.3.0.10514 movie view; artwork and synopsis redacted
    - path: screenshots/standard-profile-public-domain-movie-6.3.0.10514.png
      caption: Historical 6.3.0.10514 persisted movie view; artwork and synopsis redacted
  website: https://radarr.video
  developer: Team Radarr
  license: GPL-3.0-only
  source_code: https://github.com/Radarr/Radarr
  support: https://wiki.servarr.com/radarr
  docs: https://wiki.servarr.com/radarr
image: docker.io/linuxserver/radarr@sha256:a466ac12c33425ec22ec4bb0d71c3edb79fd5e5f845bba0e2901c1a6aa59b075
port: 7878
health: /ping
internet: true
data:
  - {path: /config, kind: config}
  - {path: /custom-cont-init.d, kind: config}
shared:
  media: /data
env:
  PUID: '0'
  PGID: '0'
  TZ: Etc/UTC
secrets:
  api_key: {kind: key}
files:
  - path: /config/config.xml
    mode: '0600'
    template: |
      <Config>
        <BindAddress>*</BindAddress>
        <Port>7878</Port>
        <SslPort>9898</SslPort>
        <EnableSsl>False</EnableSsl>
        <LaunchBrowser>False</LaunchBrowser>
        <ApiKey>${secret.api_key}</ApiKey>
        <AuthenticationMethod>External</AuthenticationMethod>
        <AuthenticationRequired>Enabled</AuthenticationRequired>
        <Branch>master</Branch>
        <LogLevel>info</LogLevel>
        <UrlBase></UrlBase>
        <InstanceName>Radarr</InstanceName>
      </Config>
  - path: /custom-cont-init.d/10-youeye-media-paths
    mode: '0700'
    template: |
      #!/usr/bin/with-contenv bash
      set -euo pipefail
      install -d -m 0775 /data/torrents /data/torrents/incomplete /data/media/tv /data/media/movies
provides:
  - {type: pvr, description: Movie PVR (Radarr), port: 7878, scope: service}
connects:
  - app: prowlarr
    name: Prowlarr
    description: Manage indexers for Radarr in Prowlarr
    scope: service
    setup: setup/connect-prowlarr.yaml
  - app: qbittorrent
    name: qBittorrent
    description: Send movie downloads to qBittorrent
    scope: service
    setup: setup/connect-qbittorrent.yaml
# How connected apps read this app's API key (${peer.api_key} in their connect setup).
api_key: {secret: api_key}
